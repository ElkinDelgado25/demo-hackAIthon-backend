name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend
        run: |
          echo "Pinging Render backend..."
          curl -fsS https://demo-hackaithon-backend.onrender.com/ || true
          echo "Done"
